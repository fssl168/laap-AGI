[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laap-enterprise"
version = "0.1.0"
description = "LAAP Enterprise — 企业级私有化部署增强包（闭源商业授权）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Lorry", email = "lorry@laap.ai" }]
license = { text = "Proprietary — see LICENSE.md" }
dependencies = [
    # 注意: 本仓库根包名为 laap (非 laap-core), 且企业模块目前仅依赖标准库。
    # 安装企业包前请先安装主包: pip install -e . (见仓库根 README)
    # GAP-G 决策 (2026-08): 移除 pydantic/cryptography —— 审计证明企业模块
    # (rbac/federation/telemetry/audit_logger/license_manager) 零使用第三方库,
    # 全部基于标准库 (hashlib/hmac/json/secrets)。移除零使用依赖保持诚实声明;
    # 若未来模块引入 Pydantic 模型或加密功能, 再按需加回。
]

[project.optional-dependencies]
console = ["fastapi>=0.110", "uvicorn>=0.29"]
plugins = ["sqlalchemy>=2.0", "redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["laap_enterprise", "laap_enterprise.*"]

[tool.mypy]
python_version = "3.11"
strict = true
