name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Validate docker-compose YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"

  e2e-network:
    name: E2E network tests (daemon + pytest -m network)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"

      - name: Start LAAP daemon (background)
        run: |
          nohup python -m laap_brain.api --port 11546 > /tmp/laap-api.log 2>&1 &
          echo "daemon pid: $!"

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11546/health >/dev/null 2>&1; then
              echo "LAAP API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "LAAP API failed to become healthy"
          tail -50 /tmp/laap-api.log || true
          exit 1

      - name: Run network-marked tests
        run: |
          python -m pytest tests -q -m network

      - name: Dump daemon log on failure
        if: failure()
        run: |
          tail -100 /tmp/laap-api.log || true
