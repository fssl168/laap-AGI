[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laap"
version = "1.0.0"
description = "LAAP — Lifeform Architecture for Autonomous Psyche. A cognitive engine that treats LLMs as a voice cortex, not a brain."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Lorry Jovens" }]
# 许可证: 分层策略见 LICENSING.md (核心引擎 BSL 1.1 → 2030 转 Apache; psi_core Apache-2.0)
# pip 包本体以 Apache-2.0 发布, 完整许可文件随包分发 (license-files)
license = "Apache-2.0"
dependencies = [
    # Hermes Agent — the "body" infrastructure (tools, LLM providers, sessions)
    "hermes-agent",
    # LAAP core — zero external LLM deps; pure cognitive architecture
    "aiohttp>=3.9.0,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "psutil>=5.9,<8",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
psi-core = []  # Rust PSI core (pip install from local path)
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
laap-brain = "laap_brain.api:main"
laap-aris = "aris_brain.aris_start_all:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE.BSL", "LICENSING.md", "COMMERCIAL_LICENSE.md"]

[tool.setuptools.packages.find]
include = [
    "laap", "laap.*",
    "laap_brain", "laap_brain.*",
    "aris_brain", "aris_brain.*",
    "psi_core", "psi_core.*",
    "mcp_server", "mcp_server.*",
]

[tool.setuptools.package-data]
aris_brain = ["state/**/*", "corpus/**/*", "memory/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]